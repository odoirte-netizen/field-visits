name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: FieldVisits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && chmod +x ./gradlew
      - run: ./gradlew assembleRelease --no-daemon
      - run: mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/FieldVisits.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FieldVisits-APK
          path: FieldVisits/out/FieldVisits.apk
