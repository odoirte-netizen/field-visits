name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: FieldVisits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && chmod +x ./gradlew
      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -nE "error:|e: |What went wrong|Duplicate class|Exception" build.log | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - run: mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/FieldVisits.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FieldVisits-APK
          path: FieldVisits/out/FieldVisits.apk
      # Also publish on the Releases page: one fixed download link that doesn't expire.
      - name: Publish to Releases (latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Field Visits APK (latest)" --notes "Latest build of the Field Visits Android app. Download FieldVisits.apk below."
          gh release upload latest out/FieldVisits.apk --clobber
          gh release edit latest --notes "Latest build of the Field Visits Android app (built $(date -u +'%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}). Download FieldVisits.apk below."
