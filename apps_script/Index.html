<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#16365c; --navy2:#1d4a7a; --blue:#1a6fae; --sky:#1ba9cf; --cyan:#8ee6fb; --ice:#e8f7fd;
  --gold:#e8a317; --gold2:#cf8c0c; --orange:#f37a1f; --green:#16a065; --red:#e0393e; --amber:#f0a500;
  --bg:#f2f6fa; --card:#ffffff; --line:#e2eaf2; --ink:#16365c; --mut:#64748b; --soft:#f6f9fc;
  --r:16px; --sh:0 6px 22px rgba(22,54,92,.08); --sh2:0 2px 8px rgba(22,54,92,.07);
  --grad:linear-gradient(135deg,#1a5f9e 0%,#1b8fc4 55%,#1bb4d8 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
.hide{display:none!important}
a{color:var(--blue)}
/* ---------- header ---------- */
.top{background:var(--grad);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(22,54,92,.18)}
.top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;opacity:.85;font-weight:600;margin-top:-3px}
.appicon{display:inline-flex;flex:none;background:#fff;border-radius:24%;box-shadow:0 2px 8px rgba(14,36,62,.18);box-sizing:border-box}
.apptitle{display:flex;align-items:center;justify-content:center;gap:10px}
.top .sp{flex:1}
.who{font-size:13px;font-weight:600;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.chipbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.chipbtn:hover{background:rgba(255,255,255,.26)}
/* ---------- nav ---------- */
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:25}
.nav .in{max-width:1240px;margin:0 auto;display:flex;gap:4px;padding:0 12px}
.nav button{background:none;border:0;padding:12px 16px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px}
.nav button.on{color:var(--navy);border-bottom-color:var(--gold)}
.nav svg{width:20px;height:20px}
@media (max-width:760px){
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  .nav .in{padding:0}
  .nav button{flex:1;flex-direction:column;gap:2px;padding:8px 2px 7px;font-size:12px;border-bottom:0;border-top:3px solid transparent}
  .nav button.on{border-top-color:var(--gold);border-bottom:0;color:var(--blue)}
  main{padding-bottom:90px!important}
  .who{display:none}
}
main{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
/* ---------- titles ---------- */
.ptitle{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.ptitle h1{margin:0;font-size:24px;font-weight:800;color:var(--navy);position:relative;padding-bottom:6px}
.ptitle h1:after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:56px;height:3px;border-radius:3px;background:var(--gold)}
.ptitle .sp{flex:1}
.ptitle .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{font-size:17px;margin:0 0 12px;color:var(--navy);font-weight:800}
.mut{color:var(--mut)} .small{font-size:13px}
/* ---------- cards / grid ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.grid{display:grid;gap:14px}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-bottom:16px}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
@media (max-width:520px){.g2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr;gap:10px}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;text-align:start;width:100%}
.kpi:hover{border-color:var(--cyan);box-shadow:0 8px 26px rgba(27,169,207,.18)}
.kpi:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--sky)}
.kpi.gold:before{background:var(--gold)} .kpi.red:before{background:var(--red)} .kpi.green:before{background:var(--green)} .kpi.navy:before{background:var(--navy)}
.kpi .l{font-size:13px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:800;color:var(--navy);line-height:1.2;margin-top:2px}
.kpi.red .v{color:var(--red)}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px}
@media (max-width:520px){.kpi .v{font-size:21px}.kpi{padding:12px}}
.bar{height:8px;background:#eaf1f7;border-radius:8px;position:relative;margin-top:8px;overflow:visible}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--sky),var(--blue))}
.bar i.good{background:linear-gradient(90deg,#3ccf8e,var(--green))}
.bar i.mid{background:linear-gradient(90deg,#ffc94a,var(--gold))}
.bar i.bad{background:linear-gradient(90deg,#ff8a7a,var(--red))}
.bar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy);opacity:.55}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--ice);color:var(--blue)}
.pill.good{background:#e3f7ee;color:var(--green)} .pill.mid{background:#fff4dc;color:#b77b00} .pill.bad{background:#fde8e8;color:var(--red)}
.pill.grey{background:#eef2f6;color:var(--mut)}
/* ---------- forms ---------- */
label.f{display:block;font-size:13px;color:var(--mut);font-weight:700;margin:0 0 5px}
.in-f{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border .15s}
.in-f:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(27,169,207,.15)}
.in-f.err{border-color:var(--red);background:#fff8f8}
select.in-f{padding:10px 12px}
textarea.in-f{min-height:70px;resize:vertical}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fld{margin-bottom:12px}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.gold{background:var(--gold);color:#fff;box-shadow:0 6px 16px rgba(232,163,23,.35)}
.btn.gold:hover{background:var(--gold2)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:var(--sky)}
.btn.red{background:#fff;border:1.5px solid #f3c2c3;color:var(--red)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.big{padding:15px 26px;font-size:17px;width:100%}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:999px;padding:5px 12px;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
/* ---------- tables ---------- */
.tw{overflow:auto;border-radius:12px;border:1px solid var(--line);background:#fff;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{background:var(--soft);color:var(--mut);font-weight:800;font-size:12.5px;line-height:1.25;text-align:start;vertical-align:bottom;padding:10px 10px;white-space:normal;min-width:64px;position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
.t td{padding:9px 10px;border-bottom:1px solid #eef3f7;vertical-align:middle;white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t tr.tot td{background:#f7fbfe;font-weight:800;border-top:2px solid var(--line)}
.t td.n,.t th.n{text-align:end;font-variant-numeric:tabular-nums}
.t td.wrap{white-space:normal;min-width:160px}
.t .sticky{position:sticky;inset-inline-start:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line)}
.t th.sticky{background:var(--soft);z-index:3}
.t tr.tot td.sticky{background:#f7fbfe}
.num{background:none;border:0;padding:3px 7px;border-radius:8px;cursor:pointer;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.num:hover{background:var(--ice);color:var(--blue)}
.num.red{color:var(--red)} .num.zero{color:#a5b3c2;font-weight:600}
/* rep table: one colour per column (Option 1) */
:root{ --c-sales:#d8930c; --c-coll:#16a065; --c-vis:#1ba9cf; --c-fake:#e0393e; --c-cust:#16365c; }
.num.c-sales{color:var(--c-sales)} .num.c-coll{color:var(--c-coll)} .num.c-vis{color:var(--c-vis)} .num.c-fake{color:var(--c-fake)} .num.c-cust{color:var(--c-cust)}
.num.c-sales.zero,.num.c-coll.zero,.num.c-vis.zero,.num.c-fake.zero,.num.c-cust.zero{color:#a5b3c2}
.hd{display:inline} .hd i{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:middle;margin-inline-end:6px;position:relative;top:-1px}
.cnum{font-weight:700;font-variant-numeric:tabular-nums}
.minibar{width:70px;display:inline-block;vertical-align:middle}
.minibar .bar{margin-top:0;height:7px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin:1px 2px;background:#fde8e8;color:var(--red)}
.tag.note{background:#eef2f6;color:var(--mut)}
.ok{color:var(--green);font-weight:800}
/* ---------- list cards (mobile customers/visits) ---------- */
.lc{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #eef3f7}
.lc:last-child{border-bottom:0}
.lc .main{flex:1;min-width:0}
.lc .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#c7d3df}
.dot.on{background:var(--green)}
/* ---------- modal ---------- */
.mb{position:fixed;inset:0;background:rgba(14,36,62,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.md{background:#fff;border-radius:18px;width:100%;max-width:880px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.md.narrow{max-width:520px}
.md .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--grad);color:#fff}
.md .mh b{font-size:17px;flex:1}
.md .mh button{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.md .mc{padding:16px 18px}
.md .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* alert box for missing fields */
.alert{border-radius:14px;padding:14px 16px;margin:0 0 14px;border:1.5px solid #f6c6c7;background:#fff5f5}
.alert b{color:var(--red);display:block;margin-bottom:6px}
.alert ul{margin:0;padding-inline-start:20px}
.alert li{margin:3px 0;font-weight:600}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.toast.good{background:var(--green)} .toast.bad{background:var(--red)}
@media (max-width:760px){.toast{bottom:86px}}
/* ---------- login ---------- */
.login{min-height:100vh;background:var(--grad);display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.25);width:100%;max-width:410px;padding:26px 24px}
.login h1{margin:8px 0 2px;text-align:center;font-size:21px;color:var(--navy)}
.login .co{text-align:center;color:var(--mut);font-weight:700;font-size:13px;margin-bottom:18px}
.login .logo{display:flex;justify-content:center;margin-top:4px}
.err-line{color:var(--red);font-weight:700;margin:6px 0 0;min-height:22px}
/* ---------- combobox ---------- */
.cb{position:relative}
.cb .list{position:absolute;inset-inline:0;top:100%;margin-top:4px;background:#fff;border:1.5px solid var(--sky);border-radius:12px;box-shadow:var(--sh);max-height:300px;overflow:auto;z-index:20}
.cb .opt{padding:10px 13px;cursor:pointer;border-bottom:1px solid #f0f4f8}
.cb .opt:last-child{border-bottom:0}
.cb .opt:hover,.cb .opt.hl{background:var(--ice)}
.cb .opt b{display:block}
.cb .opt span{font-size:12.5px;color:var(--mut)}
.picked{display:flex;align-items:center;gap:12px;border:1.5px solid var(--cyan);background:var(--ice);border-radius:12px;padding:10px 12px}
.picked .main{flex:1;min-width:0}
.loc{display:flex;align-items:center;gap:12px;border-radius:12px;padding:11px 13px;font-weight:700;border:1.5px solid var(--line);background:var(--soft)}
.loc.ok{border-color:#9ee0c1;background:#effbf5;color:var(--green)}
.loc.bad{border-color:#f6c6c7;background:#fff5f5;color:var(--red)}
.loc .sp{flex:1}
.spin{width:18px;height:18px;border:3px solid #cfe7f3;border-top-color:var(--sky);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:40px;text-align:center;color:var(--mut)}
.empty{padding:26px;text-align:center;color:var(--mut)}
.chart{position:relative;height:280px}
.chart.tall{height:360px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:700;color:var(--mut);cursor:pointer}
.subtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.switch{position:relative;width:46px;height:26px;display:inline-block;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cdd8e3;border-radius:26px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:20px;height:20px;inset-inline-start:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{transform:translateX(20px)}
[dir=rtl] .switch input:checked+span:before{transform:translateX(-20px)}
.hint{background:var(--ice);border:1px solid #c9ecf8;border-radius:12px;padding:10px 13px;font-size:13.5px;color:var(--navy2)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-inline-start:auto}
</style>
</head>

function call(action, data){
  return new Promise(function(res, rej){
    var req = Object.assign({action:action, token:S.token}, data||{});
    google.script.run.withSuccessHandler(function(r){
      if(r && r.ok) return res(r.data);
      var code = (r && r.err) || 'SERVER';
      if(code==='AUTH' && action!=='login'){ signOut(true); }
      var e = new Error(code); e.code=code; e.msg=r&&r.msg; rej(e);
    }).withFailureHandler(function(err){
      var e = new Error('NETWORK'); e.code='NETWORK'; e.msg=String(err&&err.message||err); rej(e);
    }).api(req);
  });
}

/* ---------------- boot ---------------- */
function applyLang(){ document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==='ar'?'rtl':'ltr'; }
function boot(){
  S.lang = store('lang') || 'en'; applyLang();
  S.token = store('token') || '';
  S.month = todayStr().slice(0,7);
  if(!S.token) return showLogin();
  $('#app').innerHTML = '<div class="loading">'+t('loading')+'</div>';
  call('me').then(function(me){ S.me=me; if(me.mustChange) return showMustChange(); shell(); })
    .catch(function(e){ if(e.code!=='AUTH') { showLogin(errText(e)); } });
}
function toggleLang(){ S.lang = S.lang==='en'?'ar':'en'; store('lang', S.lang); applyLang(); if(S.me && !S.me.mustChange) shell(); else if(S.me) showMustChange(); else showLogin(); }
function signOut(silent){ if(S.token && !silent){ call('logout').catch(function(){}); } S.token=''; S.me=null; store('token', null); S.clients=null; showLogin(silent? t('e_AUTH'):''); }

/* ---------------- login ---------------- */
function showLogin(msg){
  destroyCharts();
  $('#app').innerHTML =
  '<div class="login"><div class="box">'+
   '<div class="flex" style="justify-content:flex-end"><button class="btn ghost sm" onclick="toggleLang()">'+t('lang')+'</button></div>'+
   '<div class="logo">'+logo(104)+'</div>'+
   '<h1 class="apptitle">'+appIcon(30)+'<span>'+t('appName')+'</span></h1><div class="co">'+t('company')+'</div>'+
   '<div class="fld"><label class="f">'+t('email')+'</label><input id="lg_e" class="in-f" type="email" autocomplete="username" inputmode="email" dir="ltr"></div>'+
   '<div class="fld"><label class="f">'+t('password')+'</label><input id="lg_p" class="in-f" type="password" autocomplete="current-password" dir="ltr"></div>'+
   '<button id="lg_b" class="btn gold big">'+t('login')+'</button>'+
   '<div class="err-line" id="lg_m">'+esc(msg||'')+'</div>'+
  '</div></div>';
  var last = store('email'); if(last) $('#lg_e').value=last;
  $('#lg_b').onclick = doLogin;
  $('#lg_p').onkeydown = function(e){ if(e.key==='Enter') doLogin(); };
}
function doLogin(){
  var em=$('#lg_e').value.trim(), pw=$('#lg_p').value;
  $('#lg_m').textContent=''; $('#lg_b').disabled=true;
  call('login',{email:em, password:pw}).then(function(r){
    S.token=r.token; S.me=r.me; store('token', r.token); store('email', em);
    if(r.me.mustChange) showMustChange(pw); else { S.page='summary'; shell(); }
  }).catch(function(e){ $('#lg_m').textContent=errText(e); $('#lg_b').disabled=false; });
}

  $('#app').innerHTML =

function kpi(color, kind, rep, label, value, sub, p, pace){

function nb(kind, rep, val, title, red, ck){ var z=(val===0||val==='0'); return '<button class="num'+(ck?' c-'+ck:'')+(red&&!z&&!ck?' red':'')+(z?' zero':'')+'" data-d="'+kind+'" data-rep="'+esc(rep)+'" data-title="'+esc(title)+'">'+(typeof val==='string'?val:fmt(val))+'</button>'; }
function hdot(k,label){ var i=label.indexOf(' '), first=i<0?label:label.slice(0,i), rest=i<0?'':label.slice(i);

var COL = {navy:'#16365c', blue:'#1a6fae', sky:'#1ba9cf', cyan:'#8ee6fb', gold:'#e8a317', orange:'#f37a1f', green:'#16a065', red:'#e0393e', grey:'#c7d3df'};
function chartOK(){ return typeof Chart!=='undefined'; }
function baseOpts(extra){
  var o = { responsive:true, maintainAspectRatio:false, animation:{duration:350},
    plugins:{ legend:{ rtl:S.lang==='ar', labels:{ font:{family:'Tajawal',weight:'700'}, boxWidth:12, color:COL.navy } },
      tooltip:{ rtl:S.lang==='ar', titleFont:{family:'Tajawal'}, bodyFont:{family:'Tajawal'} } },
    scales:{ x:{ ticks:{font:{family:'Tajawal'},color:'#64748b'}, grid:{color:'#eef3f7'} }, y:{ ticks:{font:{family:'Tajawal'},color:'#64748b'}, grid:{color:'#eef3f7'}, beginAtZero:true } } };
  return deepMerge(o, extra||{});
}
function deepMerge(a,b){ Object.keys(b).forEach(function(k){ if(b[k] && typeof b[k]==='object' && !Array.isArray(b[k]) && a[k] && typeof a[k]==='object') deepMerge(a[k],b[k]); else a[k]=b[k]; }); return a; }
function mkChart(id, cfg){ if(!chartOK()) { var c=$('#'+id); if(c) c.parentNode.innerHTML='<div class="empty small">Charts need internet</div>'; return null; } var el=$('#'+id); if(!el) return null; var ch=new Chart(el, cfg); S.charts.push(ch); return ch; }
/* writes each bar's value inside the bar (or just outside when the bar is too short) */
var barValues = { id:'barValues', afterDatasetsDraw:function(ch){
  var ctx=ch.ctx; ctx.save(); ctx.font='700 12px Tajawal, sans-serif'; ctx.textBaseline='middle';
  ch.data.datasets.forEach(function(ds,di){
    var meta=ch.getDatasetMeta(di); if(meta.hidden) return;
    meta.data.forEach(function(bar,i){
      var v=ds.data[i]; if(!v) return;
      var txt=fmt(v), w=ctx.measureText(txt).width, len=Math.abs(bar.x-bar.base), dir=bar.x>=bar.base?1:-1;
      if(len>w+14){ ctx.fillStyle='#fff'; ctx.textAlign=dir>0?'right':'left'; ctx.fillText(txt, bar.x-dir*7, bar.y); }
      else { ctx.fillStyle='#16365c'; ctx.textAlign=dir>0?'left':'right'; ctx.fillText(txt, bar.x+dir*5, bar.y); }
    });
  });
  ctx.restore();
}};
function achChart(reps){
  var rs = reps.filter(function(r){ return r.sales||r.coll; }).sort(function(a,b){ return (b.sales+b.coll)-(a.sales+a.coll); });
  if(!rs.length){ var c=$('#c_ach'); if(c){ c.parentNode.style.height='auto'; c.parentNode.innerHTML='<div class="empty">'+t('noData')+'</div>'; } return; }
  $('#c_ach').parentNode.style.height = Math.max(280, rs.length*58+70)+'px';
  mkChart('c_ach',{ type:'bar', data:{ labels:rs.map(function(r){return r.name;}), datasets:[
    {label:t('sales'), data:rs.map(function(r){return r.sales;}), backgroundColor:COL.gold, borderRadius:6, barPercentage:.8},
    {label:t('collection'), data:rs.map(function(r){return r.coll;}), backgroundColor:COL.sky, borderRadius:6, barPercentage:.8}
  ]}, plugins:[barValues], options: baseOpts({ indexAxis:'y', scales:{ x:{ ticks:{ callback:function(v){ return fmt(v); } } }, y:{ position: S.lang==='ar'?'right':'left' } },
    plugins:{ tooltip:{ callbacks:{ label:function(c){ return c.dataset.label+': '+money(c.raw); } } } } }) });
}

function visitHead(showRep){ var mgr=S.me.role==='manager'; return '<thead><tr><th>'+t('date')+'</th><th>'+t('time')+'</th>'+(showRep?'<th>'+t('rep')+'</th>':'')+'<th>'+t('customer')+'</th><th>'+t('area')+'</th><th>'+t('person')+'</th><th>'+t('mobile')+'</th>'+(mgr?'<th>'+t('flags')+'</th><th class="n">'+t('distance')+'</th>':'')+'<th>'+t('pin')+'</th></tr></thead>'; }
function tagsHtml(v){ if(!v.tags) return v.flag?'<span class="tag">!</span>':'<span class="ok">✓</span>'; return v.tags.split(/\s+/).filter(Boolean).map(function(x){ var strong=['MOCK','FAR','FROZEN','TELEPORT','ROUND','BURST','DUP'].indexOf(x)>=0; var lb=t('tag_'+x); if(lb.indexOf('tag_')===0) lb=x.replace(/_/g,' '); return '<span class="tag'+(strong?'':' note')+'">'+esc(lb)+'</span>'; }).join('')+(v.flag?'':' <span class="ok">✓</span>'); }

function presetRange(p){
  var td=todayStr(), m=td.slice(0,7);
  if(p==='today') return [td,td];
  if(p==='yesterday'){ var y=addDays(td,-1); return [y,y]; }
  if(p==='lastMonth'){ var lm=addDays(m+'-01',-1).slice(0,7); return [lm+'-01', monthEnd(lm)]; }
  if(p==='custom') return [VF.from||m+'-01', VF.to||td];
  return [m+'-01', td];
}
function pgVisitsMgr(){
  var rg=presetRange(VF.preset); VF.from=rg[0]; VF.to=rg[1];
  call('visits',{from:VF.from, to:VF.to, rep:VF.rep}).then(function(d){ S.vdata=d; renderVisitsMgr(); }).catch(fail);

function statCard(color,label,value,sub){ return '<div class="kpi '+color+'" style="cursor:default"><div class="l">'+esc(label)+'</div><div class="v">'+value+'</div><div class="s">'+esc(sub||'')+'</div></div>'; }
function repStats(d){

/* searchable dropdown */
function combo(host, list, value, onPick){
  function draw(){
    var c = list.filter(function(x){return x.code===value;})[0];
    if(c){
      host.innerHTML='<div class="picked"><div class="main"><b>'+esc(c.name)+'</b><div class="small mut">'+esc(c.area||'')+' · '+esc(c.code)+(c.map?' · <a href="'+esc(c.map)+'" target="_blank" rel="noopener">'+t('openMap')+'</a>':'')+'</div></div><button class="btn ghost sm" type="button">'+t('change')+'</button></div>';
      $('button',host).onclick=function(){ value=''; onPick(''); draw(); var i=$('input',host); if(i) i.focus(); };
      return;
    }
    host.innerHTML='<div class="cb"><input class="in-f" type="search" autocomplete="off" placeholder="'+t('pickCustomer')+'"><div class="list hide"></div></div>';
    var inp=$('input',host), box=$('.list',host), hl=0, cur=[];
    function filter(){
      var q=norm(inp.value);
      cur=list.filter(function(x){ return !q || norm(x.name+' '+x.code+' '+x.area).indexOf(q)>=0; }).slice(0,60);
      hl=0;
      box.innerHTML = cur.length? cur.map(function(x,i){ return '<div class="opt'+(i===hl?' hl':'')+'" data-i="'+i+'"><b>'+esc(x.name)+'</b><span>'+esc(x.area||'')+' · '+esc(x.code)+'</span></div>'; }).join('') : '<div class="empty small">'+t('noData')+'</div>';
      box.classList.remove('hide');
      $$('.opt',box).forEach(function(o){
        o.onmousedown=function(e){ e.preventDefault(); };          // keep the list open while tapping
        o.onclick=function(){ pick(cur[+o.getAttribute('data-i')]); };
      });
    }
    function pick(x){ if(!x) return; value=x.code; onPick(x.code); draw(); }
    inp.onfocus=filter; inp.oninput=filter;
    inp.onblur=function(){ setTimeout(function(){ if(box.isConnected) box.classList.add('hide'); },250); };
    inp.onkeydown=function(e){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); hl=Math.max(0,Math.min(cur.length-1,hl+(e.key==='ArrowDown'?1:-1))); $$('.opt',box).forEach(function(o,i){o.classList.toggle('hl',i===hl); if(i===hl) o.scrollIntoView({block:'nearest'});}); }
      if(e.key==='Enter'){ e.preventDefault(); pick(cur[hl]); }
    };
  }
  draw();
}

function renderLoc(){
  var el=$('#nv_loc'); if(!el) return;
  var g=NV.gps, st=NV.gpsState, err=NV.gpsErr||'nofix', app=!!(window.AndroidGPS&&AndroidGPS.openSettings);
  if(st==='getting') el.innerHTML='<div class="loc"><span class="spin"></span><span>'+t('locGetting')+'<div class="small mut" style="font-weight:600">'+t('locSearching')+'</div></span></div>';
  else if(st==='ok') el.innerHTML='<div class="loc ok"><span>✓</span><span>'+t('locReady')+(g.accuracy?' · ±'+Math.round(g.accuracy)+' m':'')+'</span><span class="sp"></span><button class="btn ghost sm" type="button" id="nv_rl">'+t('retry')+'</button></div>';
  else el.innerHTML='<div class="loc bad" style="flex-wrap:wrap"><span>⚠</span><span style="flex:1;min-width:200px">'+t('loc_'+err)+'</span>'+
    '<span class="flex" style="gap:8px">'+
    (app&&err==='denied'?'<button class="btn ghost sm" type="button" id="nv_set" data-w="app">'+t('btnAllow')+'</button>':'')+
    (app&&err==='off'?'<button class="btn ghost sm" type="button" id="nv_set" data-w="loc">'+t('btnTurnOn')+'</button>':'')+
    '<button class="btn gold sm" type="button" id="nv_rl">'+t('retry')+'</button></span></div>';
  if($('#nv_rl')) $('#nv_rl').onclick=function(){ getGps(); };
  if($('#nv_set')) $('#nv_set').onclick=function(){ try{ AndroidGPS.openSettings(this.getAttribute('data-w')); }catch(e){} };
}
function getGps(){
  NV.gpsState='getting'; NV.gps=null; NV.gpsErr=''; renderLoc();
  var done=function(g, err){ NV.gps=g; NV.gpsErr=g?'':(err||'nofix'); NV.gpsState=g?'ok':'bad'; renderLoc(); if($('#nv_alert') && $('#nv_alert').innerHTML) validateVisit(true); };
  var web=function(srcTag, errIfFail){
    if(!navigator.geolocation) return done(null, errIfFail||'nofix');
    navigator.geolocation.getCurrentPosition(function(p){
      done({lat:p.coords.latitude, lon:p.coords.longitude, accuracy:p.coords.accuracy, altitude:p.coords.altitude, mock:false, source:srcTag});
    }, function(e){ done(null, errIfFail || (e && e.code===1 ? 'web' : 'nofix')); }, {enableHighAccuracy:true, timeout:20000, maximumAge:60000});
  };
  if(window.AndroidGPS && AndroidGPS.requestLocation){
    try{ AndroidGPS.requestLocation(); }catch(e){ return web('android-web'); }
    var n=0, iv=setInterval(function(){
      n++; var r=''; try{ r=AndroidGPS.pollResult(); }catch(e){}
      if(r){
        clearInterval(iv);
        var o={}; try{ o=JSON.parse(r); }catch(e){}
        if(o.ok && o.lat!=null) return done({lat:o.lat,lon:o.lon,accuracy:o.accuracy,altitude:o.altitude,mock:!!o.mock,source:'android'+(o.provider?'-'+o.provider:'')});
        if(o.err==='nofix') return web('android-web','nofix');   // last try through the page itself
        return done(null, o.err||'nofix');
      }
      if(n>100){ clearInterval(iv); done(null,'nofix'); }   // 30 s
    },300);
    return;
  }
  web('web');
}

  var a=$('#nv_alert'); if(!a) return;

    var txt = (k==='LOCATION' && NV.gpsErr) ? t('loc_'+NV.gpsErr) : t('miss_'+k);
    return '<li>'+txt+'</li>'; }).join('')+'</ul></div>' : '';

function validateVisit(quiet){
  var miss=[], p=$('#nv_p').value.trim(), m=$('#nv_m').value.replace(/[\s-]/g,'');

  if(!m) miss.push('MOBILE'); else if(!/^\+?\d{8,15}$/.test(m)) miss.push('MOBILE_BAD');
  if(!NV.gps) miss.push('LOCATION');
  $('#nv_p').classList.toggle('err', miss.indexOf('PERSON')>=0);
  $('#nv_m').classList.toggle('err', miss.indexOf('MOBILE')>=0||miss.indexOf('MOBILE_BAD')>=0);
  var ci=$('#nv_cb input'); if(ci) ci.classList.toggle('err', miss.indexOf('CUSTOMER')>=0);
  showMissing(miss);

/* ======================================================================
   EXCEL: read & write in the browser (ExcelJS, loaded only when needed)
   ====================================================================== */
var _xl=null;
function loadExcel(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(_xl) return _xl;
  _xl=new Promise(function(res,rej){
    var sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    sc.onload=function(){ window.ExcelJS?res(window.ExcelJS):rej(new Error('lib')); };
    sc.onerror=function(){ _xl=null; rej(new Error('lib')); };
    document.head.appendChild(sc);
  });
  return _xl;
}
function cellVal(v){
  if(v===null||v===undefined) return '';
  if(v instanceof Date) return v;
  if(typeof v==='object'){
    if(v.richText) return v.richText.map(function(x){return x.text;}).join('');
    if(v.hyperlink!==undefined) return v.text&&typeof v.text==='object'&&v.text.richText? v.text.richText.map(function(x){return x.text;}).join(''): (v.text||v.hyperlink);
    if(v.result!==undefined) return cellVal(v.result);
    if(v.error) return '';
    return String(v);
  }
  return v;
}
function ymd(v){
  if(v instanceof Date) return v.getUTCFullYear()+'-'+p2(v.getUTCMonth()+1)+'-'+p2(v.getUTCDate());
  if(typeof v==='number' && v>20000 && v<80000){ var d=new Date(Math.round((v-25569)*864e5)); return ymd(d); }
  var s=String(v||'').trim().replace(/[\u0660-\u0669]/g,function(c){return c.charCodeAt(0)-0x660;}), m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return m[1]+'-'+p2(+m[2])+'-'+p2(+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return m[3]+'-'+p2(+m[2])+'-'+p2(+m[1]);
  return s;
}
function hm(v){
  if(v instanceof Date) return p2(v.getUTCHours())+':'+p2(v.getUTCMinutes());
  if(typeof v==='number' && v<1){ var mins=Math.round(v*1440); return p2(Math.floor(mins/60)%24)+':'+p2(mins%60); }
  var s=String(v||'').trim(), m=s.match(/(\d{1,2}):(\d{2})\s*([AaPp]\.?[Mm]|ص|م)?/);
  if(!m) return '';
  var h=+m[1], ap=(m[3]||'').toLowerCase();
  if((ap[0]==='p'||ap==='م') && h<12) h+=12;
  if((ap[0]==='a'||ap==='ص') && h===12) h=0;
  return p2(h)+':'+m[2];
}
function readBook(file){
  return loadExcel().then(function(X){ return file.arrayBuffer().then(function(buf){ var wb=new X.Workbook(); return wb.xlsx.load(buf).then(function(){ return wb; }); }); });
}
function sheetRows(ws){
  var out=[];
  ws.eachRow({includeEmpty:false}, function(row, n){ var a=[]; row.eachCell({includeEmpty:true}, function(c, col){ a[col-1]=cellVal(c.value); }); out.push({n:n, v:a}); });
  return out;
}
function saveBlob(blob, name){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------------- Settings → Import visits (FocusQuad) ---------------- */
var FQ = { rows:null, name:'', range:'2' };
function stImport(){
  var h='<div class="card" style="max-width:820px"><h2>'+t('fqTitle')+'</h2><div class="hint" style="margin-bottom:12px">'+t('fqHelp')+'</div>'+
    '<label class="btn gold" style="margin:0">⬆ '+t('chooseFile')+'<input type="file" id="fq_f" accept=".xlsx" class="hide"></label>'+
    '<div id="fq_b" style="margin-top:14px"></div></div>';
  $('#st_body').innerHTML=h;
  $('#fq_f').onchange=function(){ var f=this.files[0]; this.value=''; if(f) readFq(f); };
  if(FQ.rows) fqPanel();
}
function readFq(file){
  $('#fq_b').innerHTML='<div class="loc"><span class="spin"></span><span>'+t('reading')+'</span></div>';
  readBook(file).then(function(wb){
    var rows=null;
    wb.worksheets.forEach(function(ws){
      if(rows) return;
      var all=sheetRows(ws); if(!all.length) return;
      var head=(all[0].v||[]).map(function(x){ return String(x||'').trim().toLowerCase(); });
      var ix=function(){ for(var i=0;i<arguments.length;i++){ var k=head.indexOf(arguments[i]); if(k>=0) return k; } return -1; };
      var c={ date:ix('visit_date'), by:ix('created_by'), name:ix('rep_name'), id:ix('id'), time:ix('completed_time'), client:ix('client_name'),
        code:ix('client_code'), type:ix('visit_type'), comment:ix('comment'), check:ix('location_check'), dist:ix('distance_m'),
        raw:ix('aa_actual_raw'), act:ix('actual_location') };
      if(c.date<0 || (c.by<0 && c.name<0)) return;
      rows=[];
      all.slice(1).forEach(function(r){
        var v=r.v, g=function(k){ return k<0?'':v[k]; };
        var d=ymd(g(c.date)); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
        var url=String(g(c.raw)||'')+' '+String(typeof g(c.act)==='string'?g(c.act):'');
        var m=url.match(/[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
        var chk=String(g(c.check)||'').toUpperCase(), tags=[];
        if(chk==='FAKE') tags.push('FAR'); if(chk==='NO_EXPECTED_LOC') tags.push('NO_CLIENT_LOC');
        var code=g(c.code); if(typeof code==='number') code=String(code);
        rows.push({ id:String(g(c.id)||(d+'-'+r.n)), date:d, time:hm(g(c.time)), rep:String(g(c.by)||'').trim(), repName:String(g(c.name)||'').trim(),
          code:String(code||'').trim(), client:String(g(c.client)||'').trim(), type:String(g(c.type)||'').trim(), comment:String(g(c.comment)||'').trim(),
          lat:m?+m[1]:null, lon:m?+m[2]:null, dist:typeof g(c.dist)==='number'?g(c.dist):null, flag:chk==='FAKE', tags:tags.join(' ') });
      });
    });
    if(!rows){ $('#fq_b').innerHTML='<div class="alert"><b>'+t('notFqFile')+'</b></div>'; return; }
    FQ.rows=rows; FQ.name=file.name; FQ.range='2'; fqPanel();
  }).catch(function(e){ $('#fq_b').innerHTML='<div class="alert"><b>'+(e&&e.message==='lib'?t('libFail'):esc(String(e&&e.message||e)))+'</b></div>'; });
}
function fqPick(){
  var days=uniq(FQ.rows.map(function(r){return r.date;})).sort();
  var sel=FQ.range==='all'? FQ.rows : (function(){ var keep=days.slice(-(+FQ.range)); return FQ.rows.filter(function(r){ return keep.indexOf(r.date)>=0; }); })();
  return { days:days, sel:sel };
}
function fqPanel(){
  var p=fqPick(), d=p.days, sel=p.sel, sd=uniq(sel.map(function(r){return r.date;})).sort();
  var fake=sel.filter(function(r){return r.flag;}).length;
  $('#fq_b').innerHTML=
    '<div class="hint" style="margin-bottom:12px"><b>'+esc(FQ.name)+'</b> — '+t('fileHas')+' <b>'+fmt(FQ.rows.length)+'</b> '+t('visitsFrom')+' '+dLabel(d[0],true)+' → '+dLabel(d[d.length-1],true)+'</div>'+
    '<div class="seg" id="fq_r">'+[['1',t('lastDay')],['2',t('lastNDays').replace('{n}','2')],['7',t('lastNDays').replace('{n}','7')],['all',t('allFile')]].map(function(o){ return '<button data-r="'+o[0]+'" class="'+(FQ.range===o[0]?'on':'')+'">'+o[1]+'</button>'; }).join('')+'</div>'+
    '<div class="kpis" style="margin-top:14px">'+statCard('navy',t('willImport'),fmt(sel.length), sd.length? dLabel(sd[0])+(sd.length>1?' → '+dLabel(sd[sd.length-1]):''):'')+
      statCard('',t('activeReps'),fmt(uniq(sel.map(function(r){return r.rep||r.repName;})).length),'')+statCard('red',t('fakeVisits'),fmt(fake), sel.length?Math.round(fake/sel.length*100)+'%':'')+'</div>'+
    '<button class="btn gold" id="fq_go">'+t('importNow')+'</button><div id="fq_res" style="margin-top:14px"></div>';
  $$('#fq_r button').forEach(function(b){ b.onclick=function(){ FQ.range=b.getAttribute('data-r'); fqPanel(); }; });
  $('#fq_go').onclick=function(){ fqImport(sel); };
}
function fqImport(sel){
  var btn=$('#fq_go'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> '+t('importing');
  var chunks=[], i; for(i=0;i<sel.length;i+=1000) chunks.push(sel.slice(i,i+1000));
  var tot={added:0,duplicates:0,unknownReps:{},from:'',to:''}, k=0;
  var next=function(){
    if(k>=chunks.length) return done();
    btn.innerHTML='<span class="spin"></span> '+t('importing')+' '+Math.round(k/chunks.length*100)+'%';
    call('importVisits',{rows:chunks[k++]}).then(function(r){
      tot.added+=r.added; tot.duplicates+=r.duplicates; r.unknownReps.forEach(function(x){ tot.unknownReps[x]=1; });
      if(r.from && (!tot.from||r.from<tot.from)) tot.from=r.from; if(r.to && r.to>tot.to) tot.to=r.to;
      next();
    }).catch(function(e){ btn.disabled=false; btn.textContent=t('importNow'); toast(errText(e),'bad'); });
  };
  var done=function(){
    btn.disabled=false; btn.textContent=t('importNow');
    var dd=uniq(sel.map(function(r){return r.date;})).sort(), unk=Object.keys(tot.unknownReps);
    $('#fq_res').innerHTML='<div class="card" style="background:#effbf5;border-color:#9ee0c1;box-shadow:none">'+
      '<div class="flex"><b class="ok" style="font-size:17px">✓ '+t('added')+': '+fmt(tot.added)+'</b><span class="mut">'+t('duplicatesSkipped')+': '+fmt(tot.duplicates)+'</span>'+
      '<button class="btn gold right" id="fq_open">'+t('openVisits')+'</button></div>'+
      (unk.length?'<div class="alert" style="margin:12px 0 0"><b>'+t('unknownReps')+'</b>'+esc(unk.join('، '))+'</div>':'')+'</div>';
    $('#fq_open').onclick=function(){ VF.preset='custom'; VF.from=dd[0]; VF.to=dd[dd.length-1]; VF.rep=''; S.month=dd[dd.length-1].slice(0,7); S.day=dd[dd.length-1]; go('visits'); };
    toast(t('added')+': '+fmt(tot.added),'good');
  };
  next();
}

/* ---------------- Sales & collection Excel form ---------------- */
var SF_HEAD=['Date / التاريخ','Representative / المندوب','Type / النوع','Amount / المبلغ','Customer / العميل','Invoice-Ref / المرجع'];
function downloadSalesForm(reps){
  $('#sf_m').innerHTML='<span class="spin"></span>';
  loadExcel().then(function(X){
    var wb=new X.Workbook(); wb.creator='Field Visits';
    var ws=wb.addWorksheet('Form',{views:[{state:'frozen',ySplit:1}]});
    var ls=wb.addWorksheet('Lists');
    ls.addRow(['Representative / المندوب','Email','','Type / النوع']);
    var types=['Sales','Collection','مبيعات','تحصيل'];
    var n=Math.max(reps.length,types.length);
    for(var i=0;i<n;i++) ls.addRow([reps[i]?reps[i].name:null, reps[i]?reps[i].email:null, null, types[i]||null]);
    ls.getRow(1).font={bold:true}; ls.columns=[{width:30},{width:34},{width:4},{width:18}];
    ws.columns=[{width:14},{width:30},{width:16},{width:16},{width:36},{width:20}];
    var hr=ws.addRow(SF_HEAD); hr.height=24;
    hr.eachCell(function(c){ c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF16365C'}}; c.alignment={vertical:'middle',horizontal:'center'}; c.border={bottom:{style:'medium',color:{argb:'FFE8A317'}}}; });
    for(var r=2;r<=501;r++){
      ws.getCell('A'+r).numFmt='yyyy-mm-dd';
      ws.getCell('A'+r).dataValidation={type:'date',operator:'greaterThan',allowBlank:true,formulae:[new Date(Date.UTC(2020,0,1))],showErrorMessage:true,errorTitle:'Date',error:'Enter a date, e.g. 2026-10-29'};
      ws.getCell('B'+r).dataValidation={type:'list',allowBlank:true,formulae:['Lists!$A$2:$A$'+(reps.length+1)],showErrorMessage:true,errorTitle:'Representative',error:'Choose a representative from the list'};
      ws.getCell('C'+r).dataValidation={type:'list',allowBlank:true,formulae:['Lists!$D$2:$D$5'],showErrorMessage:true,errorTitle:'Type',error:'Sales / Collection'};
      ws.getCell('D'+r).numFmt='#,##0.00';
      ws.getCell('D'+r).dataValidation={type:'decimal',operator:'greaterThan',allowBlank:true,formulae:[0],showErrorMessage:true,errorTitle:'Amount',error:'Enter a number greater than 0'};
    }
    return wb.xlsx.writeBuffer();
  }).then(function(buf){
    $('#sf_m').textContent='';
    saveBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'Sales_Collection_Form.xlsx');
  }).catch(function(e){ $('#sf_m').textContent=e&&e.message==='lib'?t('libFail'):String(e&&e.message||e); });
}
function uploadSalesForm(file){
  $('#sf_m').innerHTML='<span class="spin"></span> '+t('reading');
  readBook(file).then(function(wb){
    var ws=wb.getWorksheet('Form')||wb.worksheets[0];
    var all=sheetRows(ws), hi=-1, map=null;
    var keys={date:/date|تاريخ/i, rep:/rep|مندوب/i, type:/type|نوع/i, amount:/amount|مبلغ|قيمة/i, client:/customer|client|عميل/i, ref:/ref|invoice|مرجع|فاتورة/i};
    for(var i=0;i<Math.min(all.length,10);i++){
      var h=all[i].v.map(function(x){return String(x||'');}), m={}, hits=0;
      Object.keys(keys).forEach(function(k){ var j=-1; h.forEach(function(x,ix){ if(j<0 && keys[k].test(x)) j=ix; }); m[k]=j; if(j>=0) hits++; });
      if(hits>=3){ hi=i; map=m; break; }
    }
    if(!map){ map={date:0,rep:1,type:2,amount:3,client:4,ref:5}; hi=-1; }
    var rows=[];
    all.slice(hi+1).forEach(function(r){
      var g=function(k){ return map[k]<0?'':r.v[map[k]]; };
      if(!String(g('date')||'').trim() && !String(g('rep')||'').trim() && !String(g('amount')||'').trim()) return;
      rows.push({line:r.n, date:ymd(g('date')), rep:String(g('rep')||'').trim(), type:String(g('type')||'').trim(),
        amount:g('amount')===''?'':String(g('amount')), client:String(g('client')||'').trim(), ref:String(g('ref')||'').trim()});
    });
    $('#sf_m').textContent='';
    if(!rows.length){ toast(t('nothingToImport')); return; }
    return call('importSalesRows',{rows:rows, dryRun:true}).then(function(pv){ salesPreview(rows, pv); });
  }).catch(function(e){ $('#sf_m').textContent=e&&e.message==='lib'?t('libFail'):errText(e); });
}
function salesPreview(rows, pv){
  var ok=pv.rows.filter(function(r){return r.status==='ok';}).length;
  var b='<div class="kpis" style="margin-bottom:12px">'+statCard('green',t('rowsOk'),fmt(ok), t('sales')+': '+money(pv.totals.sales)+' · '+t('collection')+': '+money(pv.totals.collection))+
    statCard('',t('rowsDup'),fmt(pv.duplicates),'')+statCard('red',t('rowsErr'),fmt(pv.errors),'')+'</div>'+
    '<div class="tw" style="max-height:55vh"><table class="t"><thead><tr><th>'+t('line')+'</th><th></th><th>'+t('date')+'</th><th>'+t('rep')+'</th><th>'+t('type')+'</th><th class="n">'+t('amount')+'</th><th>'+t('customer')+'</th><th>'+t('ref')+'</th></tr></thead><tbody>'+
    pv.rows.map(function(r){
      var pill=r.status==='ok'?'good':r.status==='duplicate'?'grey':'bad';
      return '<tr'+(r.status==='error'?' style="background:#fff7f7"':'')+'><td class="mut">'+r.line+'</td><td><span class="pill '+pill+'">'+t('st_'+r.status)+'</span>'+
        (r.errors.length?'<div class="small" style="color:var(--red);font-weight:700">'+r.errors.map(function(x){return t('er_'+x);}).join(' · ')+'</div>':'')+'</td>'+
        '<td>'+esc(r.date)+'</td><td>'+esc(r.repName||'')+'</td><td>'+(r.type?t(r.type):'')+'</td><td class="n"><b>'+(r.amount==null?'':money(r.amount))+'</b></td><td class="wrap">'+esc(r.client)+'</td><td>'+esc(r.ref)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  var foot='<button class="btn ghost" onclick="closeModal()">'+t('cancel')+'</button><button class="btn gold" id="sp_go"'+(pv.toAdd?'':' disabled')+'>'+t('importNow')+' ('+pv.toAdd+')</button>';
  modal(t('preview'), b, foot);
  $('#sp_go').onclick=function(){
    this.disabled=true; this.innerHTML='<span class="spin"></span>';
    call('importSalesRows',{rows:rows}).then(function(r){
      closeModal(); toast(t('importDone')+': '+r.toAdd,'good');
      var ms=uniq(r.rows.filter(function(x){return x.status==='ok';}).map(function(x){return x.date.slice(0,7);})).sort();
      if(ms.length){ ST.smonth=ms[ms.length-1]; S.month=ms[ms.length-1]; }
      stSales();
    }).catch(function(e){ toast(errText(e),'bad'); $('#sp_go').disabled=false; $('#sp_go').textContent=t('importNow'); });
  };
}

boot();
