plugins { id 'com.android.application' }

android {
    namespace 'com.odo.fieldvisits'
    compileSdk 34

    defaultConfig {
        applicationId "com.odo.fieldvisits"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            // debug-signed so the output APK is installable by sideload
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
