plugins { id 'com.android.application' }

android {
    namespace 'com.odo.fieldvisits'
    compileSdk 34

    defaultConfig {
        applicationId "com.odo.fieldvisits"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }
    // Fixed key: every new APK installs over the previous one (no uninstall needed).
    signingConfigs {
        fixed {
            storeFile file('fieldvisits.jks')
            storePassword 'fieldvisits-umdco'
            keyAlias 'fieldvisits'
            keyPassword 'fieldvisits-umdco'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
